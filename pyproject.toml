[project]
name = "resourcemind-ai"
version = "0.1.0"
description = "Adaptive emergency resource allocation under changing demand (decision-support prototype, synthetic data)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
